<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренировки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171A; --surface: #1D2124; --surface-2: #24292D; --border: #313739;
    --text: #E9E7E2; --text-dim: #9BA0A3; --accent: #E8A33D; --accent-dim: #4A3A1C;
    --good: #6FBF8B; --bad: #D9684F;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F3F1EC; --surface: #FFFFFF; --surface-2: #EDEAE3; --border: #DEDAD1;
      --text: #201D18; --text-dim: #706A5E; --accent: #B4791F; --accent-dim: #E9D3A8;
      --good: #2E7D4F; --bad: #B8412A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171A; --surface: #1D2124; --surface-2: #24292D; --border: #313739;
    --text: #E9E7E2; --text-dim: #9BA0A3; --accent: #E8A33D; --accent-dim: #4A3A1C;
    --good: #6FBF8B; --bad: #D9684F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-ui); -webkit-font-smoothing: antialiased;
    padding-bottom: 88px; min-height: 100vh;
  }
  header {
    padding: 20px 16px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header .count { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    gap: 6px; z-index: 10;
  }
  .tabbtn {
    flex: 1; background: none; border: none; color: var(--text-dim);
    font-family: var(--font-ui); font-size: 13px; font-weight: 500;
    padding: 10px 4px; border-radius: 10px; cursor: pointer;
  }
  .tabbtn.active { background: var(--surface-2); color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; animation: fadein .15s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 5px; }
  input, select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 9px; padding: 10px 11px;
    font-family: var(--font-ui); font-size: 15px; margin-bottom: 10px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  ::placeholder { color: var(--text-dim); opacity: 0.55; }

  .sessFlags { display: flex; gap: 8px; margin-bottom: 14px; }
  .tplHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .tplHead label { margin: 0; }
  .tplChips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tplChip {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font-ui); font-size: 13px; padding: 8px 12px; border-radius: 20px; cursor: pointer;
  }
  .tplChip.suggested { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); font-weight: 600; }
  .tplChip .delx { margin-left: 7px; color: var(--bad); font-weight: 700; }
  .tplEmpty { font-size: 12.5px; color: var(--text-dim); }
  .flagBtn {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    font-family: var(--font-ui); font-size: 12.5px; padding: 9px 6px; border-radius: 9px; cursor: pointer;
  }
  .flagBtn.on { background: rgba(217,104,79,0.16); border-color: var(--bad); color: var(--bad); }

  .setrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .setrow input { margin-bottom: 0; font-family: var(--font-mono); }
  .setrow .w { flex: 1; } .setrow .r { flex: 1; }
  .setrow .x { color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; }
  .iconbtn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 17px; width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
  }
  .iconbtn:active { background: var(--surface-2); }
  .exblock { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 12px; }
  .exblock:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .exhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
  .exhead input { margin: 0; }
  .exrow2 { margin-bottom: 9px; }
  .exrow2 select { margin-bottom: 0; font-size: 13.5px; }
  .setFail {
    flex: 0 0 auto; width: 32px; height: 40px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-dim); font-size: 14px; cursor: pointer; opacity: 0.55;
  }
  .setFail.on { background: rgba(232,163,61,0.18); border-color: var(--accent); opacity: 1; }
  .lasthint {
    font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
    margin-bottom: 9px; opacity: 0.75; line-height: 1.5;
  }
  .lasthint b { color: var(--accent); font-weight: 500; }
  .commentInput { margin-top: 4px; margin-bottom: 0; font-size: 13.5px; }
  .btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    font-family: var(--font-ui); font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-save { background: var(--good); color: #082810; margin-top: 4px; }
  .btn-sm { padding: 8px 12px; font-size: 13px; width: auto; }

  .sesscard { margin-bottom: 10px; }
  .sesshead { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 8px; }
  .sessdate { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px; }
  .sessmeta { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; }
  .sessbody { display: none; margin-top: 10px; }
  .sessbody.open { display: block; }
  .exline { padding: 7px 0; border-top: 1px solid var(--border); }
  .exline:first-child { border-top: none; }
  .exname { font-size: 13.5px; font-weight: 500; margin-bottom: 2px; }
  .exsets { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); }
  .excomment { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; font-style: italic; }
  .muscletag {
    font-family: var(--font-mono); font-size: 10px; color: var(--accent);
    background: var(--accent-dim); padding: 1px 6px; border-radius: 5px; margin-right: 6px; font-style: normal;
  }
  .setflag { color: var(--accent); font-size: 12px; }
  .del { color: var(--bad); background: none; border: none; font-size: 12px; cursor: pointer; padding: 4px 0; margin-top: 6px; }

  .empty { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 40px 20px; }
  .groupheader { font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin: 20px 4px 8px; }
  .groupheader:first-child { margin-top: 0; }
  .progcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .progcard-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .progname { font-size: 14.5px; font-weight: 600; }
  .trend { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .trend.up { background: rgba(111,191,139,0.15); color: var(--good); }
  .trend.down { background: rgba(217,104,79,0.15); color: var(--bad); }
  .trend.flat { background: var(--surface-2); color: var(--text-dim); }
  .chart-holder { width: 100%; }
  .progsvg { width: 100%; height: 150px; display: block; }
  .gridline { stroke: var(--border); stroke-width: 1; }
  .axislabel { font-family: var(--font-mono); font-size: 9px; fill: var(--text-dim); }
  .progline { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .progdot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
  .progdot.last { fill: var(--accent); }
  .delta { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); margin-top: 12px; }
  .delta .num { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
  .delta .lbl { font-size: 12.5px; color: var(--text-dim); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1>Тренировки</h1>
  <span class="count" id="sessCount"></span>
</header>

<main>

  <div class="view active" id="view-add">
    <div class="card">
      <div class="tplHead">
        <label>Шаблон</label>
        <button class="iconbtn" onclick="toggleTemplateManage()">⚙️</button>
      </div>
      <div id="tplChips" class="tplChips"></div>
      <div id="tplManage" style="display:none; margin-top:10px">
        <button class="btn btn-ghost btn-sm" onclick="saveCurrentAsTemplate()">💾 Сохранить текущий список как шаблон</button>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="exportBackup()">⬇️ Скачать бэкап (JSON)</button>
        <label class="btn btn-ghost btn-sm" style="display:block; text-align:center; cursor:pointer; margin-top:8px">
          ⬆️ Загрузить из файла
          <input type="file" accept="application/json" style="display:none" onchange="importBackup(event)">
        </label>
      </div>
    </div>
    <div class="card">
      <label>Дата</label>
      <input type="date" id="sessDate">
      <div class="sessFlags">
        <button type="button" id="flagFood" class="flagBtn" onclick="this.classList.toggle('on')">🍽️ Плохо поел</button>
        <button type="button" id="flagSleep" class="flagBtn" onclick="this.classList.toggle('on')">😴 Плохо спал</button>
      </div>
      <div id="exContainer"></div>
      <button class="btn btn-ghost" onclick="addExerciseBlock()" style="margin-top:4px">+ упражнение</button>
      <button class="btn btn-save" onclick="saveSession()">Сохранить тренировку</button>
    </div>
  </div>

  <div class="view" id="view-history">
    <div id="historyList"></div>
  </div>

  <div class="view" id="view-progress">
    <div id="progressList"></div>
  </div>

</main>

<div class="tabbar">
  <button class="tabbtn active" data-view="add" onclick="switchView('add')">Добавить</button>
  <button class="tabbtn" data-view="history" onclick="switchView('history')">История</button>
  <button class="tabbtn" data-view="progress" onclick="switchView('progress')">Прогресс</button>
</div>

<datalist id="exerciseNames"></datalist>

<script>
const STORE_KEY = 'gymTrackerSessions';
const TPL_KEY = 'gymTrackerTemplates';
const MUSCLES = ['Ноги','Спина','Грудь','Плечи','Руки','Предплечья','Пресс','Другое'];
let sessions = [];
let templates = [];
let activeTemplateId = null;
let manageMode = false;

function loadSessions() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  } catch (e) { sessions = []; }
}
function saveSessions() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); }
  catch (e) { alert('Не удалось сохранить — возможно, хранилище переполнено.'); }
}

function loadTemplates() {
  try {
    const raw = localStorage.getItem(TPL_KEY);
    templates = raw ? JSON.parse(raw) : [];
  } catch (e) { templates = []; }
}
function saveTemplates() {
  try { localStorage.setItem(TPL_KEY, JSON.stringify(templates)); }
  catch (e) { alert('Не удалось сохранить шаблон.'); }
}

function suggestedTemplateId() {
  if (!templates.length) return null;
  for (let i = sessions.length - 1; i >= 0; i--) {
    const tid = sessions[i].templateId;
    if (tid && templates.some(t => t.id === tid)) {
      const idx = templates.findIndex(t => t.id === tid);
      return templates[(idx + 1) % templates.length].id;
    }
  }
  return templates[0].id;
}

function renderTemplateChips() {
  const box = document.getElementById('tplChips');
  if (!templates.length) {
    box.innerHTML = '<span class="tplEmpty">Пока нет шаблонов — заполни список упражнений и сохрани его как шаблон.</span>';
    return;
  }
  const suggested = suggestedTemplateId();
  box.innerHTML = templates.map(t => {
    const isSuggested = t.id === suggested;
    const delBtn = manageMode ? `<span class="delx" onclick="event.stopPropagation(); deleteTemplate('${t.id}')">✕</span>` : '';
    return `<span class="tplChip${isSuggested ? ' suggested' : ''}" onclick="loadTemplate('${t.id}')">${isSuggested ? '→ ' : ''}${t.name}${delBtn}</span>`;
  }).join('');
}

function toggleTemplateManage() {
  manageMode = !manageMode;
  document.getElementById('tplManage').style.display = manageMode ? 'block' : 'none';
  renderTemplateChips();
}

function loadTemplate(id) {
  const tpl = templates.find(t => t.id === id);
  if (!tpl) return;
  document.getElementById('exContainer').innerHTML = '';
  tpl.items.forEach(item => {
    addExerciseBlock(item.name);
    const blocks = document.querySelectorAll('#exContainer .exblock');
    const block = blocks[blocks.length - 1];
    if (item.muscle) {
      block.querySelector('.muscleSelect').value = item.muscle;
      block.dataset.muscleTouched = '1';
    }
  });
  activeTemplateId = id;
}

function saveCurrentAsTemplate() {
  const blocks = document.querySelectorAll('#exContainer .exblock');
  const items = [];
  blocks.forEach(block => {
    const name = block.querySelector('.exNameInput').value.trim();
    if (!name) return;
    items.push({ name, muscle: block.querySelector('.muscleSelect').value });
  });
  if (!items.length) { alert('Сначала впиши названия упражнений в список ниже.'); return; }
  const name = prompt('Название шаблона (например «Цикл А»):');
  if (!name) return;
  const existing = templates.find(t => t.name.toLowerCase() === name.trim().toLowerCase());
  if (existing) {
    if (!confirm(`Шаблон «${existing.name}» уже есть — перезаписать?`)) return;
    existing.items = items;
  } else {
    templates.push({ id: 'tpl' + Date.now(), name: name.trim(), items });
  }
  saveTemplates();
  renderTemplateChips();
}

function deleteTemplate(id) {
  const tpl = templates.find(t => t.id === id);
  if (!tpl || !confirm(`Удалить шаблон «${tpl.name}»?`)) return;
  templates = templates.filter(t => t.id !== id);
  saveTemplates();
  renderTemplateChips();
}

document.getElementById('sessDate').valueAsDate = new Date();

function muscleOptions(selected) {
  return '<option value="">Группа мышц</option>' + MUSCLES.map(m =>
    `<option value="${m}"${m === selected ? ' selected' : ''}>${m}</option>`
  ).join('');
}

function addExerciseBlock(name) {
  const container = document.getElementById('exContainer');
  const id = 'ex' + Date.now() + Math.random().toString(36).slice(2,6);
  const block = document.createElement('div');
  block.className = 'exblock';
  block.id = id;
  block.innerHTML = `
    <div class="exhead">
      <input list="exerciseNames" placeholder="Название упражнения" class="exNameInput" value="${name ? name.replace(/"/g,'') : ''}">
      <button class="iconbtn" onclick="document.getElementById('${id}').remove()">✕</button>
    </div>
    <div class="exrow2">
      <select class="muscleSelect">${muscleOptions('')}</select>
    </div>
    <div class="lasthint" style="display:none"></div>
    <div class="setsContainer"></div>
    <button class="btn btn-ghost btn-sm" onclick="addSetRow('${id}')">+ подход</button>
    <input type="text" class="commentInput" placeholder="Комментарий (необязательно)">
  `;
  container.appendChild(block);
  const nameInput = block.querySelector('.exNameInput');
  const muscleSelect = block.querySelector('.muscleSelect');
  nameInput.addEventListener('input', () => updateLastHint(nameInput));
  nameInput.addEventListener('change', () => updateLastHint(nameInput));
  muscleSelect.addEventListener('change', () => { block.dataset.muscleTouched = '1'; });
  addSetRow(id);
  if (name) updateLastHint(nameInput);
}

function getLastExercise(exName) {
  const target = exName.trim().toLowerCase();
  for (let i = sessions.length - 1; i >= 0; i--) {
    const ex = sessions[i].exercises.find(e => e.name.trim().toLowerCase() === target);
    if (ex) return ex;
  }
  return null;
}

function getMuscleForName(exName) {
  const target = exName.trim().toLowerCase();
  for (let i = sessions.length - 1; i >= 0; i--) {
    const ex = sessions[i].exercises.find(e => e.name.trim().toLowerCase() === target && e.muscle);
    if (ex) return ex.muscle;
  }
  return '';
}

function updateLastHint(nameInput) {
  const block = nameInput.closest('.exblock');
  const name = nameInput.value.trim();
  const last = name ? getLastExercise(name) : null;

  block.dataset.lastSets = last ? JSON.stringify(last.sets) : '';
  const hint = block.querySelector('.lasthint');
  if (last && last.sets && last.sets.length) {
    hint.innerHTML = 'Прошлый раз: ' + last.sets.map(s => `<b>${s.w}</b>×${s.r}${s.failure ? '<span class="setflag">🚩</span>' : ''}`).join('  ');
    hint.style.display = '';
  } else {
    hint.style.display = 'none';
  }
  applyPlaceholders(block);

  const muscleSelect = block.querySelector('.muscleSelect');
  const knownMuscle = getMuscleForName(name);
  if (knownMuscle && block.dataset.muscleTouched !== '1') {
    muscleSelect.value = knownMuscle;
  }

  const commentInput = block.querySelector('.commentInput');
  commentInput.placeholder = last && last.comment ? `Прошлый раз: ${last.comment}` : 'Комментарий (необязательно)';
}

function applyPlaceholders(block) {
  const raw = block.dataset.lastSets;
  const last = raw ? JSON.parse(raw) : null;
  block.querySelectorAll('.setrow').forEach((row, i) => {
    const w = row.querySelector('.w');
    const r = row.querySelector('.r');
    if (last && last[i]) {
      w.placeholder = String(last[i].w);
      r.placeholder = String(last[i].r);
    } else {
      w.placeholder = 'вес';
      r.placeholder = 'повт.';
    }
  });
}

function addSetRow(blockId) {
  const setsContainer = document.querySelector('#' + blockId + ' .setsContainer');
  const row = document.createElement('div');
  row.className = 'setrow';
  row.innerHTML = `
    <input class="w" type="number" inputmode="decimal" placeholder="вес">
    <span class="x">×</span>
    <input class="r" type="number" inputmode="numeric" placeholder="повт.">
    <button type="button" class="setFail" onclick="this.classList.toggle('on')" title="Отказ на этом подходе">🚩</button>
    <button class="iconbtn" onclick="this.parentElement.remove()">✕</button>
  `;
  setsContainer.appendChild(row);
  applyPlaceholders(document.getElementById(blockId));
}

function saveSession() {
  const date = document.getElementById('sessDate').value;
  if (!date) { alert('Укажи дату'); return; }
  const blocks = document.querySelectorAll('#exContainer .exblock');
  const exercises = [];
  blocks.forEach(block => {
    const name = block.querySelector('.exNameInput').value.trim();
    if (!name) return;
    const sets = [];
    block.querySelectorAll('.setrow').forEach(row => {
      const w = parseFloat(row.querySelector('.w').value);
      const r = parseInt(row.querySelector('.r').value);
      if (!isNaN(w) && !isNaN(r)) sets.push({ w, r, failure: row.querySelector('.setFail').classList.contains('on') });
    });
    if (!sets.length) return;
    exercises.push({
      name,
      muscle: block.querySelector('.muscleSelect').value,
      comment: block.querySelector('.commentInput').value.trim(),
      sets
    });
  });
  if (!exercises.length) { alert('Добавь хотя бы одно упражнение с подходом'); return; }

  sessions.push({
    date,
    ateBad: document.getElementById('flagFood').classList.contains('on'),
    sleptBad: document.getElementById('flagSleep').classList.contains('on'),
    templateId: activeTemplateId,
    exercises
  });
  sessions.sort((a,b) => a.date.localeCompare(b.date));
  saveSessions();

  activeTemplateId = null;
  document.getElementById('flagFood').classList.remove('on');
  document.getElementById('flagSleep').classList.remove('on');
  document.getElementById('exContainer').innerHTML = '';
  addExerciseBlock();
  updateExerciseNames();
  renderHistory();
  renderAllProgress();
  renderTemplateChips();
  switchView('history');
}

function deleteSession(idx) {
  if (!confirm('Удалить эту тренировку?')) return;
  sessions.splice(idx, 1);
  saveSessions();
  renderHistory();
  updateExerciseNames();
  renderAllProgress();
}

function updateExerciseNames() {
  const names = new Set();
  sessions.forEach(s => s.exercises.forEach(e => names.add(e.name)));
  const dl = document.getElementById('exerciseNames');
  dl.innerHTML = [...names].map(n => `<option value="${n.replace(/"/g,'')}">`).join('');
}

function fmtDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  document.getElementById('sessCount').textContent = sessions.length ? sessions.length + ' трен.' : '';
  if (!sessions.length) {
    list.innerHTML = '<div class="empty">Пока нет ни одной тренировки.<br>Добавь первую во вкладке «Добавить».</div>';
    return;
  }
  const ordered = [...sessions].reverse();
  list.innerHTML = ordered.map((s, i) => {
    const realIdx = sessions.length - 1 - i;
    const exCount = s.exercises.length;
    const setCount = s.exercises.reduce((a,e) => a + e.sets.length, 0);
    const bodyId = 'body' + realIdx;
    const flags = (s.ateBad ? '🍽️' : '') + (s.sleptBad ? '😴' : '');
    const exLines = s.exercises.map(e => {
      const muscleTag = e.muscle ? `<span class="muscletag">${e.muscle}</span>` : '';
      const commentLine = e.comment ? `<div class="excomment">${e.comment}</div>` : '';
      const setsStr = e.sets.map(st => st.w + '×' + st.r + (st.failure ? '<span class="setflag">🚩</span>' : '')).join('  ');
      return `<div class="exline"><div class="exname">${muscleTag}${e.name}</div><div class="exsets">${setsStr}</div>${commentLine}</div>`;
    }).join('');
    return `
      <div class="card sesscard">
        <div class="sesshead" onclick="document.getElementById('${bodyId}').classList.toggle('open')">
          <span class="sessdate">${fmtDate(s.date)} ${flags}</span>
          <span class="sessmeta">${exCount} упр · ${setCount} подх.</span>
        </div>
        <div class="sessbody" id="${bodyId}">
          ${exLines}
          <button class="del" onclick="deleteSession(${realIdx})">Удалить тренировку</button>
        </div>
      </div>`;
  }).join('');
}

function sparklineSVG(points) {
  const w = 320, h = 150;
  const padL = 32, padR = 10, padT = 14, padB = 22;
  const innerW = w - padL - padR, innerH = h - padT - padB;

  const values = points.map(p => p.w);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; } else { const pad = (max - min) * 0.18; min -= pad; max += pad; }

  const stepX = points.length > 1 ? innerW / (points.length - 1) : 0;
  const xFor = i => padL + stepX * i;
  const yFor = v => padT + innerH - ((v - min) / (max - min)) * innerH;

  const gridLines = [0, 0.5, 1].map(f => {
    const y = padT + innerH * f;
    const val = Math.round(max - (max - min) * f);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" class="gridline"/><text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" class="axislabel">${val}</text>`;
  }).join('');

  const linePts = points.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.w).toFixed(1)}`).join(' ');

  const dots = points.map((p, i) => {
    const isLast = i === points.length - 1;
    return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.w).toFixed(1)}" r="${isLast ? 4.5 : 3.5}" class="progdot${isLast ? ' last' : ''}"><title>${fmtDate(p.date)}: ${p.w}×${p.r}</title></circle>`;
  }).join('');

  let labelIdxs;
  if (points.length <= 4) labelIdxs = points.map((_, i) => i);
  else labelIdxs = [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xLabels = labelIdxs.map(i =>
    `<text x="${xFor(i).toFixed(1)}" y="${h - 4}" text-anchor="middle" class="axislabel">${fmtDate(points[i].date)}</text>`
  ).join('');

  return `<svg class="progsvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <polyline points="${linePts}" class="progline"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

function progCardHtml(item) {
  const pts = item.points;
  let trendClass = 'flat', trendLabel = 'мало данных';
  if (pts.length >= 2) {
    const windowStart = pts[Math.max(0, pts.length - 4)];
    const diff = +(pts[pts.length - 1].w - windowStart.w).toFixed(1);
    if (diff > 0) { trendClass = 'up'; trendLabel = `растёт (+${diff} кг)`; }
    else if (diff < 0) { trendClass = 'down'; trendLabel = `снижается (${diff} кг)`; }
    else { trendClass = 'flat'; trendLabel = 'стоит на месте'; }
  }
  let deltaHtml = '';
  if (pts.length >= 2) {
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const diff = +(last.w - prev.w).toFixed(1);
    const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
    const sign = diff > 0 ? '+' : '';
    const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    deltaHtml = `<div class="delta"><span class="num ${cls}">${arrow} ${sign}${diff} кг</span><span class="lbl">${prev.w}×${prev.r} → ${last.w}×${last.r}</span></div>`;
  }
  return `
    <div class="progcard">
      <div class="progcard-head">
        <span class="progname">${item.name}</span>
        <span class="trend ${trendClass}">${trendLabel}</span>
      </div>
      <div class="chart-holder">${sparklineSVG(pts)}</div>
      ${deltaHtml}
    </div>`;
}

function renderAllProgress() {
  const container = document.getElementById('progressList');
  const byName = {};
  sessions.forEach(s => s.exercises.forEach(e => {
    const key = e.name.trim().toLowerCase();
    if (!byName[key]) byName[key] = { name: e.name.trim(), points: [], lastDate: s.date, muscle: '' };
    const top = e.sets.reduce((m, st) => st.w > m.w ? st : m, e.sets[0]);
    byName[key].points.push({ date: s.date, w: top.w, r: top.r });
    byName[key].lastDate = s.date;
    byName[key].muscle = e.muscle || byName[key].muscle;
  }));

  const list = Object.values(byName).sort((a, b) => b.lastDate.localeCompare(a.lastDate));

  if (!list.length) {
    container.innerHTML = '<div class="empty">Пока нет данных.<br>Добавь тренировки, чтобы увидеть графики.</div>';
    return;
  }

  const groups = {};
  list.forEach(item => {
    const g = item.muscle || '';
    (groups[g] = groups[g] || []).push(item);
  });
  const order = [...MUSCLES, ''];

  let html = '';
  order.forEach(g => {
    const items = groups[g];
    if (!items || !items.length) return;
    html += `<div class="groupheader">${g || 'Без группы'}</div>`;
    html += items.map(progCardHtml).join('');
  });
  container.innerHTML = html;
}

function exportBackup() {
  const data = { sessions, templates, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gym-tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.sessions)) throw new Error('bad format');
      const replace = confirm('ОК — заменить текущие данные загруженными.\nОтмена — объединить с тем, что уже есть (без дублей).');
      if (replace) {
        sessions = data.sessions || [];
        templates = data.templates || [];
      } else {
        const existingKeys = new Set(sessions.map(s => JSON.stringify(s)));
        (data.sessions || []).forEach(s => {
          const k = JSON.stringify(s);
          if (!existingKeys.has(k)) { sessions.push(s); existingKeys.add(k); }
        });
        sessions.sort((a, b) => a.date.localeCompare(b.date));
        const existingNames = new Set(templates.map(t => t.name.toLowerCase()));
        (data.templates || []).forEach(t => {
          if (!existingNames.has(t.name.toLowerCase())) { templates.push(t); existingNames.add(t.name.toLowerCase()); }
        });
      }
      saveSessions();
      saveTemplates();
      updateExerciseNames();
      renderHistory();
      renderAllProgress();
      renderTemplateChips();
      alert('Импортировано тренировок: ' + ((data.sessions && data.sessions.length) || 0));
    } catch (e) {
      alert('Не удалось прочитать файл — проверь, что это тот самый JSON-бэкап.');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  if (name === 'progress') renderAllProgress();
}

// init
loadSessions();
loadTemplates();
addExerciseBlock();
updateExerciseNames();
renderHistory();
renderAllProgress();
renderTemplateChips();
</script>
